version: '3.4'
services:
  timescale:
    image: timescaledev/timescaledb-ha:pg12-latest
    restart: unless-stopped
    command: -c ssl=on -c ssl_cert_file=/temp/cert/server.crt -c ssl_key_file=/temp/cert/server.key -c max_connections=200
    ports:
      - 5432:5432/tcp
    env_file:
      - database.env
    volumes:
      - ./pg-init:/docker-entrypoint-initdb.d
      - ./pg-cert:/temp/cert

  bitcoind:
    image: kylemanna/bitcoind
    ports:
      - 8332:8332
      - 18443:18443
      - 18444:18444
      - 28332:28332
      - 28333:28333
    volumes:
      - ./bitcoin.conf:/bitcoin/.bitcoin/bitcoin.conf

  lnd-alice:
    restart: unless-stopped
    image: lightninglabs/lnd:v0.18.3-beta
    depends_on:
      - bitcoind
    environment:
      - BACKEND=bitcoind
    volumes:
      - ./lnd.conf:/root/.lnd/lnd.conf
      - lnd-alice:/cfg
    ports:
      - 10009:10009
      - 9735:9735
      - 5002:5000
    command:
      - "--tlsextradomain=lnd-alice"
      - "--db.backend=postgres"
      - "--db.postgres.dsn=postgres://loop:loop@timescale:5432/lnd_alice?sslmode=disable"

  lnd-bob:
    restart: unless-stopped
    image: lightninglabs/lnd:v0.18.3-beta
    depends_on:
      - bitcoind
    environment:
      - BACKEND=bitcoind
    ports:
      - 5001:5000
    volumes:
      - ./lnd.conf:/root/.lnd/lnd.conf
      - lnd-bob:/cfg
    command:
      - "--tlsextradomain=lnd-bob"
      - "--db.backend=postgres"
      - "--db.postgres.dsn=postgres://loop:loop@timescale:5432/lnd_bob?sslmode=disable"

  loadtest:
    build: loadtest
    depends_on:
      - lnd-alice
      - lnd-bob
    volumes:
      - lnd-alice:/lnd-alice
      - lnd-bob:/lnd-bob
      - ./${LOADTEST_CONFIG_FILE}:/loadtest.yml

volumes:
  lnd-alice:
  lnd-bob:
    